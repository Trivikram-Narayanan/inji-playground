name: Inji Interoperability Matrix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

  test-matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit and integration test suite
        working-directory: backend
        run: npm test

      - name: Start Backend BFF in background
        working-directory: backend
        run: |
          cp .env.example .env
          npm run build
          node dist/index.js &
          echo "Waiting for BFF on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q '"status":"ok"'; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done

      - name: Execute Interoperability Matrix Test Runner
        run: node .github/scripts/run-matrix.mjs
        env:
          API_BASE: http://localhost:3000/api

      - name: Publish Interoperability Matrix to GitHub Step Summary
        if: always()
        run: |
          if [ -f matrix-summary.md ]; then
            cat matrix-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Matrix Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-matrix-summary
          path: matrix-summary.md
