server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # react-router-dom client-side routing - fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service in docker-compose (same-origin - avoids
    # needing CORS/VITE_API_BASE to point cross-origin in the default compose setup).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # The event stream endpoint (GET /api/flows/:id/events/stream) is Server-Sent
        # Events, not WebSocket - nginx buffers plain HTTP responses by default, which
        # would hold events back from the client until the buffer flushes.
        proxy_buffering off;
    }
}
