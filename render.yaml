services:
  - type: web
    name: inji-playground-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
